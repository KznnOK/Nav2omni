amcl:
  ros__parameters:
    use_sim_time: true

    base_frame_id: base_footprint
    odom_frame_id: odom
    global_frame_id: map
    scan_topic: scan_filtered
    tf_broadcast: true
    transform_tolerance: 0.5

    # Motion noise: the EKF odometry (tracking wheels + IMU) drifts about
    # 1 cm per 20 s of hard driving (phase 3), so much less than 0.2.
    robot_model_type: nav2_amcl::OmniMotionModel
    alpha1: 0.05
    alpha2: 0.05
    alpha3: 0.05
    alpha4: 0.05
    alpha5: 0.05

    # UTM-30LX-EW: noise about 1 cm and a 1 cm map, so a narrow hit model.
    # Beam model (ray casting) instead of likelihood_field: with the rear
    # 90 deg blind, likelihood_field barely penalizes scan points that fall
    # inside the frames ahead (38 mm thick), so the particle mean drifted
    # about +12 mm towards the LiDAR side (+x). Beam model: +0.5 mm.
    laser_model_type: beam
    z_short: 0.05                   # 仮値
    z_max: 0.02                     # 仮値
    lambda_short: 0.1               # 仮値
    laser_min_range: -1.0
    laser_max_range: -1.0
    laser_likelihood_max_dist: 1.0
    sigma_hit: 0.05
    z_hit: 0.90                     # 仮値
    z_rand: 0.03                    # 仮値
    max_beams: 120

    min_particles: 500
    max_particles: 2000
    pf_err: 0.05
    pf_z: 0.99
    resample_interval: 1

    # update on (almost) every 40 Hz scan while moving
    update_min_d: 0.02
    update_min_a: 0.02

    set_initial_pose: true
    initial_pose:
      x: -3.1510900301327864
      y: -3.136311120883107
      z: 0.0
      yaw: 0.0
