# Self-occlusion mask for the LiDAR (laser_filters, scan -> scan_filtered).
# Angles are in lidar_scan_link (0 = looking out of the mounting face,
# + counter-clockwise). Masked readings become range_max + 1 and are ignored
# by AMCL and the costmaps.
#
# 仮値: measured in simulation with the sensor at the -y face center, scan
# height 60 mm, chassis ground clearance 40 mm. Beyond about +-90 deg the rays
# hit the drive wheels and the chassis sides. Re-check when the mounting or
# the chassis changes (see the phase 2 report).
scan_to_scan_filter_chain:
  ros__parameters:
    use_sim_time: true
    filter1:
      name: mask_right_side
      type: laser_filters/LaserScanAngularBoundsFilterInPlace
      params:
        lower_angle: 1.5359      # 88 deg
        upper_angle: 2.4000      # beyond the 135 deg scan end
    filter2:
      name: mask_left_side
      type: laser_filters/LaserScanAngularBoundsFilterInPlace
      params:
        lower_angle: -2.4000
        upper_angle: -1.5359     # -88 deg
