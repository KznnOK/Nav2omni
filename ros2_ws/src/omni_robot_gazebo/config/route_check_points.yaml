# 仮値: provisional round-trip route used to check LiDAR visibility in
# phase 2. Phase 4 replaces this with the real waypoint graph.
# Poses are [x, y, yaw_deg] of base_footprint in the map frame.
# Derivation (chassis half width 0.25 m, clearances 0.05-0.10 m):
#   start   dice zone left line outer edge x=-0.725 -> -0.725-0.28-0.05
#           (+x outline 0.28 with the LiDAR body)
