controller_manager:
  ros__parameters:
    # gazebo_ros2_control applies velocity commands with SetVelocity only on
    # controller updates. Below the 1 kHz physics rate the wheels slow down
    # between updates under load, so run at the physics rate.
    update_rate: 1000
    use_sim_time: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    wheel_velocity_controller:
      type: velocity_controllers/JointGroupVelocityController

wheel_velocity_controller:
  ros__parameters:
    joints:
      - front_left_wheel_joint
      - front_right_wheel_joint
      - rear_left_wheel_joint
      - rear_right_wheel_joint
    interface_name: velocity
