# Kansai Spring Robocon 2027 "SAKURA AVENUE" field, red court.
# Source: 関西春ロボコン2027 ルールブック 図4 (フィールド平面図).
#
# Coordinates in this file are rulebook drawing coordinates in mm:
#   X from the left outer edge of the field, Y from the bottom outer edge.
#   World/map coordinates: x = X/1000 - 3.5, y = Y/1000 - 3.5
#   (field center is the origin, +x right, +y up as in 図4).
# Rectangles are [X0, X1, Y0, Y1]. Only the red court (left half) is listed;
# the blue court is generated by mirroring about X = 3500 (the field is
# line-symmetric about the center frame, 図4 note).
#
# Dimension convention found in 図4: dimensions such as 500, 1100 and 1562
# are measured from the inner face of the outer frame (X = 38 or Y = 38).

field_size: 7000
frame:
  width: 38        # 木枠断面 幅38 mm
  height: 89       # 木枠断面 高さ89 mm
line:
  width: 50        # 白線 50 mm (visual only, no step)
  tape_width: 19   # スタートゾーン境界のビニールテープ

frames:
  outer_bottom: [0, 3500, 0, 38]
  outer_top: [0, 3500, 6962, 7000]
  outer_left: [0, 38, 38, 6962]
  # Top stack from the top outer edge: 38, 1100, 38, 1100, 38, 1000, 38, 1000, 38
  l_top: [38, 1638, 5824, 5862]             # 除草剤/桜ゾーン上側, L字の上辺
  l_vertical: [1600, 1638, 1876, 5824]      # 1562 from the outer inner face; ends 1100 above area1 frame
  stub_sakura_bottom: [38, 538, 4686, 4724] # 桜ゾーン下側 (500 from inner face)
  stub_middle: [1100, 1600, 3648, 3686]     # L字内側の中段 (500 long)
  stub_lower: [38, 538, 2610, 2648]
  # Bottom stack from the bottom outer edge: 38, 700, 38 (図4 "738" on the left)
  area1_top: [38, 1638, 738, 776]
  # Center structure (common zones). Taken from the existing STL, which
  # matches 図4 within a few mm here.
  center_area1: [3481, 3500, 38, 962]       # half of the 38 mm center frame
  area3_left: [3312, 3350, 962, 6962]       # 3274 from the outer inner face
  area3_crossbar_lower: [3050, 3312, 2962, 3000]
  area3_crossbar_upper: [3050, 3312, 4962, 5000]
  # Common-zone rungs every 500 mm (Y = 1000 ... 6500 top faces), half width
  rungs:
    x: [3350, 3500]
    y_top: [1000, 1500, 2000, 2500, 3000, 3500, 4000, 4500, 5000, 5500, 6000, 6500]

lines:
  sakura_herbicide_boundary: [488, 538, 4724, 6962]  # 桜/除草剤ゾーン右端 (zone width 500)
  area1_area2_boundary: [1638, 3007, 732, 782]
  area3_left_boundary: [3007, 3057, 732, 6962]       # 300 from area3_left frame
  area1_center_boundary: [3057, 3481, 732, 782]
  dice_zone_left: [2775, 2825, 38, 732]              # サイコロゾーン左端
start_tape: [719, 738, 38, 738]                      # スタートゾーン 700 x 700
dice_marker:
  outer: [3062, 3212, 269, 419]                      # 150 mm square, 269 from bottom
  line_width: 38

# Zones used by the mission (red court).
zones:
  sakura: [38, 538, 4724, 5824]      # 桜ゾーン: 幅500 x 1100, against the left frame
  herbicide: [38, 538, 5862, 6962]   # 除草剤ゾーン
  start: [38, 738, 38, 738]          # スタートゾーン
  dice: [2825, 3481, 38, 738]        # サイコロゾーン
  area1: [38, 3481, 38, 738]         # エリア1 (inside the frames / boundary line)

colors:
  floor: [0.06, 0.45, 0.06]
  frame: [0.55, 0.38, 0.22]
  line: [0.95, 0.95, 0.95]
  red_tape: [0.85, 0.05, 0.05]
  blue_tape: [0.05, 0.15, 0.85]
