# Random autonomous-start region in front of the dice zone (evaluation only).
# Center: right outline edge `standoff` left of the dice-zone line (x -0.725),
# centered in area 1 -> (-1.055, -3.112) for the +x LiDAR outline.
# Poses are drawn uniformly in center +- half ranges and kept only when the
# outline stays inside area 1, touches no frame or the dice marker and no wall
# in the LiDAR view is nearer than its minimum range (lidar_mount_study rules).
standoff: 0.05        # 仮値
half_x: 0.30          # 仮値 (+-300 mm)
half_y: 0.15          # 仮値 (+-150 mm); clipped to about +-0.10 m by area 1
half_yaw_deg: 10.0    # 仮値 (+-10 deg)
