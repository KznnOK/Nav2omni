# Single source of truth for the robot dimensions.
# Read by the URDF (xacro.load_yaml), omni_drive_controller, omni_odometry,
# tracking_odometry and the Nav2 footprint through
# omni_robot_description.geometry. Units: m, kg, rad.

chassis:
  # Drive base (台車) outline. Confirmed: 500 x 500 mm.
  length: 0.50
  width: 0.50
  height: 0.15          # 仮値: chassis box height used for collision/visual
  # Clearance between floor and chassis bottom.
  ground_clearance: 0.04  # 仮値

# Maximum outline including the upper mechanisms. Used for collision checks,
# rotation interference checks and the costmap footprint. Kept separate from
# the chassis because the upper mechanisms will make the robot larger.
max_outline:
  length: 0.50          # 仮値
  width: 0.50           # 仮値

mass:
  total: 20.0           # about 20 kg including wheels
  drive_wheel: 0.40     # 仮値: mass of one drive omni wheel

drive_wheels:
  # 4-wheel omni in X configuration (45 deg to the chassis faces).
  # Diagonal wheels share one axle line through the robot center.
  center_distance: 0.2245   # CAD: robot center to wheel width-center (horizontal)
  diameter: 0.125
  width: 0.040
  # Wheel order matches omni_controllers.yaml.
  names: [front_left, front_right, rear_left, rear_right]
  # Direction of each wheel position seen from the robot center.
  position_angles_deg: [45.0, -45.0, 135.0, -135.0]
  # Omni wheel friction (Gazebo approximation): along rolling direction and
  # along the axle (free rollers).
  mu_rolling: 1.0           # 仮値
  mu_axle: 0.02             # 仮値
  # Motor limit. 仮値: real motor specification is not decided yet.
  max_wheel_speed: 40.0     # rad/s
  # Simulated motor: velocity PID driving joint torque (gazebo_ros2_control
  # velocity_pid). 仮値: motor/driver specification is not decided yet.
  max_wheel_torque: 5.0     # N*m
  velocity_pid: {kp: 2.0, ki: 20.0, kd: 0.0, max_integral_error: 2.0}
  geometry_confirmed: true  # real_wheel_geometry_confirmed

tracking_wheels:
  # Passive omni measuring wheels, independent of the drive wheels, pressed
  # onto the floor by a spring (prismatic joint + spring in Gazebo).
  diameter: 0.050           # 仮値
  width: 0.020              # 仮値
  wheel_mass: 0.05          # 仮値
  mount_mass: 0.05          # 仮値: moving part of the spring mount
  encoder_cpr: 4096         # 仮値: counts per wheel revolution (used in phase 5)
  spring_stiffness: 2000.0  # 仮値: N/m
  spring_preload: 15.0      # 仮値: N pressing force at the nominal height
  spring_damping: 20.0      # 仮値: N*s/m
  travel: 0.015             # 仮値: +- spring travel
  mu_rolling: 1.0           # 仮値
  mu_axle: 0.02             # 仮値
  # rolling_deg: measuring direction in base_link (0 = +x, 90 = +y).
  # xy: wheel contact position relative to the robot center.
  wheels:
    - {name: tracking_y, rolling_deg: 90.0, xy: [0.06, 0.0]}    # 仮値: (x1, y1), measures d1
    - {name: tracking_x, rolling_deg: 0.0, xy: [0.0, -0.06]}    # 仮値: (x2, y2), measures d2

imu:
  xyz: [0.0, 0.0, 0.0]      # 仮値: relative to base_link

lidar:
  # Hokuyo UTM-30LX-EW
  samples: 1081             # 270 deg / 0.25 deg + 1
  fov_deg: 270.0
  update_rate: 40.0
  range_min: 0.1
  range_max: 30.0
  noise_stddev: 0.01        # 仮値: spec accuracy +-30 mm taken as about 3 sigma
  # Body (x along the scan origin's forward axis). The scan origin is at the
  # body center, so the body sticks out of the chassis by
  # outward_offset + body_size[0] / 2; that part is added to the outline.
  body_size: [0.060, 0.060, 0.087]
  # Self-occlusion mask: computed from the chassis and wheel shapes at the
  # scan height (geometry.lidar_self_occlusion), widened by this margin.
  self_mask_margin_deg: 1.0   # 仮値
  # Nominal mounting (what the robot believes; TF uses these values).
  mount:
    face: "+x"              # chassis face the sensor looks out of (+x, -x, +y, -y); decided 2026-10-30
    outward_offset: 0.0     # 仮値: scan origin distance outside that face
    lateral_offset: 0.0     # 仮値: along the face, + is to the left when looking outward
    scan_height: 0.060      # 仮値: scan plane above the floor (must be < 0.089 frame height)
    upside_down: false      # true: mounted upside down (roll 180 deg)
